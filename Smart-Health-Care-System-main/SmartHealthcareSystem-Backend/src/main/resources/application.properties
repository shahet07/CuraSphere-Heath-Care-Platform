server.port = 8081
spring.datasource.url = jdbc:mysql://localhost:3306/healthcaresystem
spring.datasource.username = root
spring.datasource.password = 
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver
spring.jpa.show-sql = true

spring.jpa.hibernate.ddl-auto = update
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect

spring.mail.host = ${MAIL_HOST:smtp.gmail.com}
spring.mail.port = ${MAIL_PORT:587}
spring.mail.username = ${MAIL_USERNAME:}
spring.mail.password = ${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth = true
spring.mail.properties.mail.smtp.starttls.enable = true

app.mail.from = ${MAIL_FROM:${spring.mail.username:}}

app.redis.enabled = ${REDIS_ENABLED:false}
spring.redis.host = ${REDIS_HOST:localhost}
spring.redis.port = ${REDIS_PORT:6379}
spring.cache.redis.time-to-live = ${REDIS_CACHE_TTL:15m}
app.redis.cache.ttl-minutes = ${REDIS_CACHE_TTL_MINUTES:15}
